name: Docker image

# Builds the application image and pushes it to GitHub Container Registry.
#
#   ghcr.io/<owner>/zkteco_sync:<version>   on a v* tag (plus :latest)
#   ghcr.io/<owner>/zkteco_sync:edge        on every push to main
#
# A server then runs it with the compose files in this repo by pointing
# image: at it and skipping --build (DEPLOY.md). The MSSQL-capable variant
# (Dockerfile target runtime-mssql: Debian + Microsoft's ODBC driver) is a
# separate tag suffix, -mssql.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: ""
            target: runtime
          - variant: "-mssql"
            target: runtime-mssql
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && matrix.variant == '' }}
            suffix=${{ matrix.variant }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          target: ${{ matrix.target }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant || 'default' }}
          cache-to: type=gha,scope=${{ matrix.variant || 'default' }},mode=max
